<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      function setVH() {
        document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
      }
      var lastWidth = window.innerWidth;
      setVH();
      window.addEventListener('resize', function () {
        if (window.innerWidth !== lastWidth) {
          lastWidth = window.innerWidth;
          setVH();
        }
      });
    })();
  </script>
  <title>Adam Banck</title>
  <meta name="description" content="Selected work across product design, UI design, and photography." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/site.css?v=5" />
  <link rel="stylesheet" href="assets/fonts.css" />
  <link rel="stylesheet" href="dist/islands/islands.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
    }
    .home-topbar {
      flex-shrink: 0;
    }
    .page {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    footer {
      flex-shrink: 0;
      margin-top: 0;
    }
    .home-hero {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .home-main {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      gap: clamp(24px, calc(var(--vh, 1vh) * 5), 48px);
      padding: clamp(28px, calc(var(--vh, 1vh) * 5), 60px) 0 60px;
    }
    .home-kicker {
      font-size: 1.15rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 42px;
    }
    .home-name-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .home-title {
      font-family: "Marcellus", Georgia, "Times New Roman", serif;
      font-size: clamp(0.75rem, 2.2vw, 1.5rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: none;
      color: #ffffff;
      margin: -28px 0 0;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.55);
    }
    .home-intro {
      max-width: 30ch;
      font-family: "Marcellus", Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      line-height: 1.7;
      color: var(--ink);
      margin-top: clamp(2px, calc(var(--vh, 1vh) * 1), 10px);
    }
    .home-intro p {
      margin: 0;
    }
    .home-topbar {
      border-bottom: 1px solid var(--line);
    }
    .home-topbar-inner {
      display: flex;
      justify-content: center;
      padding-top: clamp(14px, calc(var(--vh, 1vh) * 2.5), 24px);
      padding-bottom: clamp(14px, calc(var(--vh, 1vh) * 2.5), 24px);
    }
    .home-contact {
      font-family: "Marcellus", Georgia, "Times New Roman", serif;
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      font-weight: 700;
      letter-spacing: clamp(0.14em, 2vw, 0.28em);
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.2s ease, color 0.2s ease;
    }
    .categories {
      display: grid;
      grid-template-columns: repeat(4, minmax(88px, 1fr));
      gap: clamp(10px, 2vw, 20px);
      width: min(780px, 92vw);
      margin-top: clamp(-32px, calc(var(--vh, 1vh) * -4), -12px);
    }
    @media (max-width: 720px) {
      .categories { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 480px) {
      .categories { grid-template-columns: repeat(2, 1fr); }
    }
    .mobile-work-carousel {
      display: none;
      width: 100%;
      margin-top: clamp(-88px, calc(var(--vh, 1vh) * -11), -56px);
    }
    @media (max-width: 640px) {
      .categories { display: none; }
      .mobile-work-carousel { display: block; }
      /* Lock the viewport on phones so there's no page scroll to fight
         with the carousel's horizontal swipe (same fix as the photography
         page's carousel). Everything has to fit in one screen, so the
         footer credit line is dropped rather than pushed off-screen. */
      html, body {
        height: calc(var(--vh, 1vh) * 100);
        overflow: hidden;
      }
      footer { display: none; }
      .home-main { padding-top: clamp(16px, calc(var(--vh, 1vh) * 3), 32px); }
    }
    .category-tile {
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, calc(var(--vh, 1vh) * 2), 16px);
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      opacity: 0.9;
      transition: opacity 0.25s ease, color 0.25s ease, border-color 0.25s ease,
                  transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (hover: hover) {
      .home-contact:hover { opacity: 1; color: var(--accent); }
      .category-tile:hover {
        opacity: 1;
        color: var(--accent);
        border-color: var(--accent);
        transform: translateY(-3px);
      }
    }
    .category-tile svg {
      width: clamp(30px, 6vw, 46px);
      height: clamp(30px, 6vw, 46px);
      stroke: currentColor;
      fill: none;
    }
    .category-tile .tile-label {
      font-family: "Marcellus", Georgia, "Times New Roman", serif;
      font-size: clamp(0.68rem, 1.4vw, 0.8rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="home-topbar">
    <div class="wrap home-topbar-inner">
      <a href="contact.html" class="home-contact">Contact</a>
    </div>
  </header>

  <div class="page">
  <div class="home-hero wrap">
    <main class="home-main">
      <!-- Mounted by src/islands/hero-name.tsx (AnimatedText component,
           src/components/ui/animated_text.tsx), built to
           dist/islands/hero-name.js. -->
      <div class="home-name-wrap">
        <div id="hero-name-root"></div>
        <p class="home-title">DTU student of Design & Innovation</p>
      </div>

      <!-- <div class="home-intro">
        <p>Engineering student focusing on design, prototyping and sustainable innovation.</p>
      </div> -->

      <p class="home-kicker serif">Selected Work</p>
      <nav class="categories" aria-label="Work categories">
        <a href="work/product-design/index.html" class="category-tile">
          <svg viewBox="0 0 64 64" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M55,7 L13,49" />
            <path d="M13,49 L6,58 L18,53 Z" fill="currentColor" stroke="none" />
            <path d="M8,57 C 14,63 22,57 28,59 C 35,61 41,55 47,57" />
          </svg>
          <span class="tile-label">Product Design</span>
        </a>
        <a href="work/cad-models/index.html" class="category-tile">
          <svg viewBox="0 0 64 64" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M32,4 L56,18 L56,46 L32,60 L8,46 L8,18 Z" />
            <path d="M32,4 L32,32 M32,32 L56,46 M32,32 L8,46" />
            <path d="M32,32 L56,18 M32,32 L8,18 M32,32 L32,60" stroke-dasharray="2.5 3.5" />
          </svg>
          <span class="tile-label">CAD Models</span>
        </a>
        <a href="work/projects/index.html" class="category-tile">
          <svg viewBox="0 0 64 64" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M8,18 C8,16 10,14 12,14 L26,14 L30,20 L52,20 C54,20 56,22 56,24 L56,48 C56,50 54,52 52,52 L12,52 C10,52 8,50 8,48 Z" />
          </svg>
          <span class="tile-label">Projects</span>
        </a>
        <a href="work/photography/index.html" class="category-tile">
          <svg viewBox="0 0 64 64" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <rect x="24" y="12" width="16" height="9" rx="2" />
            <rect x="8" y="19" width="48" height="33" rx="4" />
            <circle cx="32" cy="37" r="10" />
            <circle cx="47" cy="27" r="1.4" fill="currentColor" stroke="none" />
          </svg>
          <span class="tile-label">Photography</span>
        </a>
      </nav>
      <div id="selected-work-carousel-root" class="mobile-work-carousel" aria-label="Work categories"></div>
    </main>
  </div>
  </div>

  <footer>
    <div class="wrap foot-grid">
      <span class="meta">Adam Banck &copy; 2026</span>
    </div>
  </footer>

  <script src="assets/js/contour-background.js"></script>
  <script>
    if (window.contourBackground) {
      window.contourBackground(document.querySelector('.page'), { color: '#625B51' });
    }
  </script>
  <script type="module" src="dist/islands/hero-name.js"></script>
  <script type="module" src="dist/islands/selected-work-carousel.js"></script>
</body>
</html>
